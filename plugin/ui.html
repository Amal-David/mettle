<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{font:12px Inter,system-ui,sans-serif;margin:0;padding:22px;background:var(--figma-color-bg,#fff);color:var(--figma-color-text,#141414)}h1{font-size:23px;margin:0 0 6px}p{line-height:1.5;color:var(--figma-color-text-secondary,#666)}label{display:block;margin:16px 0 6px}select,input[type=number]{width:100%;padding:9px;border:1px solid var(--figma-color-border,#ddd);border-radius:6px;background:var(--figma-color-bg,#fff);color:inherit}button{padding:11px;border:0;border-radius:7px;font:inherit;cursor:pointer}button.primary{width:100%;background:#1c685c;color:#fff;font-weight:600;margin-top:18px}button:disabled{opacity:.4;cursor:default}.row{display:flex;gap:12px}.row>div{flex:1}.check{display:flex;align-items:center;gap:8px}.report{max-height:135px;overflow:auto;margin-top:12px;white-space:pre-wrap;font:11px ui-monospace,monospace;line-height:1.5}.minor{background:transparent;color:inherit;text-decoration:underline;padding:8px 0}.error{color:var(--figma-color-text-danger,#b42318)}.badge{font:10px ui-monospace,monospace;letter-spacing:1px}#download{background:#1c685c;color:#fff;width:100%;margin-top:12px}
</style></head><body>
<div class="badge">DIRECT NATIVE EXPORT · EXPERIMENTAL</div><h1>FigmaMetal</h1>
<p>Export real paths, paint values, and motion tracks. Render with the included Swift + Metal player. No Lottie or screenshot reconstruction.</p>
<label for="mode">Source</label><select id="mode"><option value="motion">One selection — Motion / static scene</option><option value="transition">Two frames — constrained A → B transition</option></select>
<div class="row"><div><label for="loop">Playback</label><select id="loop"><option value="once">Once</option><option value="loop">Loop</option><option value="pingPong">Ping-pong</option></select></div><div><label for="duration">A → B duration (seconds)</label><input id="duration" type="number" value="0.6" min="0.01" max="3600" step="0.1"></div></div>
<label for="origin">Explicit rotation / scale origin</label><select id="origin"><option value="center">Center of each layer</option><option value="topLeft">Top-left of each layer</option></select>
<label class="check"><input type="checkbox" id="partial">Allow incomplete export (unsupported features omitted)</label>
<button class="primary" id="export">Inspect & export selection</button>
<button id="download" hidden>Save .figmetal.json</button>
<div class="report" id="report" role="status" aria-live="polite"></div>
<button class="minor" id="create">Create A/B test frames in this file</button>
<script>
const $=id=>document.getElementById(id);let result;
$('export').onclick=()=>{ $('export').disabled=true;$('download').hidden=true;$('report').textContent='Reading source geometry and motion…';parent.postMessage({pluginMessage:{type:'export',mode:$('mode').value,loop:$('loop').value,origin:$('origin').value,duration:Number($('duration').value),allowPartial:$('partial').checked}},'*'); };
$('create').onclick=()=>parent.postMessage({pluginMessage:{type:'create-test'}},'*');
window.onmessage=event=>{
  const message=event.data.pluginMessage;if(!message)return;
  if(message.type==='ready')$('export').disabled=false;
  if(message.type==='notice')$('report').textContent=message.text;
  if(message.type==='failure'){$('report').textContent=message.message;$('report').classList.add('error');}
  if(message.type==='result'){
    result=message;$('report').classList.toggle('error',message.blocked);
    const errors=message.document.diagnostics.filter(d=>d.severity==='error').length;
    $('report').textContent=(message.blocked?'EXPORT BLOCKED — fix the errors below.':`Ready. ${errors} unsupported-feature errors.`)+'\n'+message.document.diagnostics.map(d=>`[${d.severity}] ${d.code} (${d.nodeID})\n${d.message}`).join('\n');
    $('download').hidden=message.blocked;
  }
};
$('download').onclick=()=>{if(!result||result.blocked)return;const url=URL.createObjectURL(new Blob([JSON.stringify(result.document,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=result.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);};
</script></body></html>
